name: Build APK
run-name: build-${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id:
        description: job id
        required: true
      file:
        description: nama file apk
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: apk-jobs/${{ inputs.id }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.id }}
          FILE: ${{ inputs.file }}
        run: |
          cp "apk-jobs/$JOB_ID/app/build/outputs/apk/debug/app-debug.apk" "$FILE"
          gh release create "apk-$JOB_ID" "$FILE" --title "APK $JOB_ID" --notes "Dibuat oleh WEB2BOT"
